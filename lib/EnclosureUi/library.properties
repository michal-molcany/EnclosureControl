name=EnclosureUi
version=1.0.0
author=EnclosureDisplay
maintainer=EnclosureDisplay
sentence=Browser UI for the EnclosureFanControl (C3): live status, PID gain tuning and manual fan/louvre control.
paragraph=Serves one self-contained HTML page from the board on its own port, plus a small JSON API the page polls. The page is a string constant in flash - no filesystem partition needed. Auth is the same HTTP Basic shared secret as lib/EnclosureApi (ENC_API_TOKEN), so the browser prompts once and never sees the token in JavaScript. Separate port from the enclosure API so a browser tab can never delay the CYD's fallback transport.
category=Communication
architectures=*
includes=enclosure_ui.h