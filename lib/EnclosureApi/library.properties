name=EnclosureApi
version=1.0.0
author=EnclosureDisplay
maintainer=EnclosureDisplay
sentence=HTTP JSON fallback link between PrinterDisplay (CYD) and EnclosureFanControl (C3).
paragraph=Used when ESP-NOW is unavailable because the two boards sit on different Wi-Fi channels or APs after band steering or a mesh node. The C3 serves GET/POST /api/enclosure on its own port; the CYD resolves the C3 by mDNS (with a static-IP fallback) and only queries it while the ESP-NOW link is stale. ESP-NOW stays primary.
category=Communication
architectures=*
includes=enclosure_api_server.h,enclosure_api_client.h
