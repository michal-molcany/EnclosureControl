; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; ESP32-C3 native USB: route Serial to the USB port or nothing appears on COM11.
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DSERIAL_DEBUG=1
	-I ../include
	; lib/EnclosureApi compiles every source in the library into whichever
	; project includes it. This board only SERVES the API, so only the server
	; half is built - the client half would otherwise pull HTTPClient + ESPmDNS
	; into the link for code this firmware never calls.
	-D ENCLOSURE_API_SERVER=1
	; No build-stamp flag needed: __DATE__ / __TIME__ are predefined by the
	; compiler and expand to string literals on their own, which is what
	; enclosure_version.h relies on. Passing them through -D instead silently
	; loses the second token and breaks stringification.
monitor_port = COM11
monitor_speed = 115200
; Prevent the monitor from auto-toggling the C3 into download mode on open.
monitor_dtr = 0
monitor_rts = 0
; C3 native USB: keep at ESP_ROM_BAUD (115200). The board default of 460800
; makes esptool issue CHANGE_BAUDRATE (0x0F) after the stub loads, which the
; USB-Serial-JTAG peripheral does not survive:
;   "Changing baud rate to 460800" -> "A fatal error occurred: No serial data
;   received". At 115200 esptool syncs at 115200 and skips the command entirely.
; ~970 KB takes about 40s over USB; use OTA (below) for routine updates.
upload_speed = 115200
; Second C3 native-USB quirk, independent of the baud rate: esptool's flasher
; stub starts on this board and then immediately dies reading the SPI flash:
;   "Stub running..." -> "Unable to verify flash chip connection (No serial
;   data received)". The ROM bootloader reads the same flash fine (flash_id
;   reports 4MB), so talk to the ROM loader directly. upload_flags is
;   prepended to UPLOADERFLAGS, which puts --no-stub before the write_flash
;   subcommand where esptool's parser requires it. Consequence: no -z
;   compression, hence the slower transfer noted above.
upload_flags = --no-stub
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps = 
	madhephaestus/ESP32Servo@^3.1.3
	bblanchon/ArduinoJson@^7.2.2
	tzapu/WiFiManager@^2.0.17
	olikraus/U8g2@^2.35.30
